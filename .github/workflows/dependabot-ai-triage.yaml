# Reusable weekly AI-assisted triage of open Dependabot alerts in nuxeo-web-ui and nuxeo-elements.
# It is not triggered here: nuxeo-web-ui holds the schedule and calls this workflow pinned to a commit SHA,
# so the schedule lives in an active repository and is never auto-disabled for inactivity.
# Security data never goes to logs or artifacts. State, reports and the action journal live in the private
# Jira control issue named in dependabot-ai-triage/config.json. See dependabot-ai-triage/README.md.
#
# The caller must set `concurrency` (one triage at a time, never cancelled): a concurrency group here would
# wait on the caller's own group and never start.
name: Dependabot AI triage

on:
  workflow_call:
    inputs:
      mode:
        description: 'preview or automatic; empty uses the DEPENDABOT_AI_TRIAGE_MODE variable (default preview)'
        type: string
        required: false
        default: ''
    secrets:
      DEPENDABOT_TRIAGE_GITHUB_TOKEN:
        description: 'Reads Dependabot alerts and lockfiles of the configured repositories'
        required: true
      DEPENDABOT_TRIAGE_JIRA_EMAIL:
        required: true
      DEPENDABOT_TRIAGE_TOKEN:
        description: 'Jira API token of DEPENDABOT_TRIAGE_JIRA_EMAIL'
        required: true
      DEPENDABOT_TEAMS_WEBHOOK_URL:
        required: true
      DEPENDABOT_TRIAGE_COPILOT_TOKEN:
        description: 'Token with the Copilot Requests permission, used only by the planner'
        required: true

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TRIAGE_RUN_ID: ${{ github.run_id }}
      # `vars` and `github` are the caller's: the epic, quarter and mode are set in the calling repository.
      TRIAGE_MODE: ${{ inputs.mode || vars.DEPENDABOT_AI_TRIAGE_MODE || 'preview' }}
      ALLOW_AUTOMATIC: ${{ vars.DEPENDABOT_AI_TRIAGE_ALLOW_AUTOMATIC }}
      APPROVED_REF: ${{ vars.DEPENDABOT_AI_TRIAGE_APPROVED_REF }}
      # Scheduled runs have no event payload, but they always run on the default branch.
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch || (github.event_name == 'schedule' && github.ref_name) || '' }}
      SECURITY_EPIC: ${{ vars.SECURITY_EPIC }}
      SECURITY_EPIC_QUARTER: ${{ vars.SECURITY_EPIC_QUARTER }}
      TRIAGE_DIR: dependabot-ai-triage
    steps:
      # The scripts at the exact commit the caller pinned, not the caller's own repository.
      - name: Check that the workflow source is known
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::The reusable workflow's repository and commit are unknown; refusing to run other code."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare working directory
        run: echo "TRIAGE_WORK_DIR=$RUNNER_TEMP/dependabot-ai-triage" >> "$GITHUB_ENV"

      - name: Test triage invariants
        run: npm test --prefix "$TRIAGE_DIR"

      - name: Collect alerts, Jira ownership and dependency evidence (no AI)
        id: collect
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_TRIAGE_GITHUB_TOKEN }}
          JIRA_EMAIL: ${{ secrets.DEPENDABOT_TRIAGE_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DEPENDABOT_TRIAGE_TOKEN }}
        run: node "$TRIAGE_DIR/collect.mjs"

      - name: Install Copilot CLI
        if: steps.collect.outputs.planner_needed == 'true'
        run: |
          npm install --global "@github/copilot@$(jq -r .copilot.cliVersion "$TRIAGE_DIR/config.json")"
          echo "COPILOT_BIN=$(npm prefix --global)/bin/copilot" >> "$GITHUB_ENV"

      # The agent gets read-only file tools, no MCP servers and only the Copilot token.
      - name: Plan with Copilot
        if: steps.collect.outputs.planner_needed == 'true'
        timeout-minutes: 45
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.DEPENDABOT_TRIAGE_COPILOT_TOKEN }}
        run: node "$TRIAGE_DIR/plan.mjs"

      - name: Validate plan, apply, report and notify
        if: always() && steps.collect.outcome != 'skipped'
        env:
          JIRA_EMAIL: ${{ secrets.DEPENDABOT_TRIAGE_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DEPENDABOT_TRIAGE_TOKEN }}
          DEPENDABOT_TEAMS_WEBHOOK_URL: ${{ secrets.DEPENDABOT_TEAMS_WEBHOOK_URL }}
        run: node "$TRIAGE_DIR/apply.mjs"

      - name: Remove working files
        if: always()
        run: rm -rf "$TRIAGE_WORK_DIR"
